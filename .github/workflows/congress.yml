name: Congress trades

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python job.py
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
